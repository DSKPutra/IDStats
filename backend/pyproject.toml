[project]
name = "idstats-backend"
version = "0.1.0"
description = "IDStats — backend FastAPI (Statistika, Riset Operasi, Optimasi ML)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "uvicorn[standard]>=0.30", "statsmodels>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Rumus LaTeX & pesan panjang tidak bisa dipecah formatter; panjang baris ditangani `ruff format`.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Depends"]
