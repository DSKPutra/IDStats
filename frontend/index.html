<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <meta name="author" content="Dea Saka Kurnia Putra" />
    <meta name="copyright" content="© 2026 Dea Saka Kurnia Putra" />
    <meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080A09" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IDStats — kalkulator & modul belajar Statistika, Riset Operasi, dan Optimasi Machine Learning." />
    <title>IDStats — Dea Saka Kurnia Putra</title>
    <script>
      try {
        const t = localStorage.getItem('idstats-theme')
        const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
